<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6500">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>後台管理｜廣告數據回報</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app app--wide">
    <header>
      <div class="hdr-side">
        <button id="home" class="link" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>回報系統
        </button>
      </div>
      <strong>後台管理</strong>
      <div class="hdr-side hdr-side--end">
        <button id="logout" class="icon-btn" type="button" aria-label="登出">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
        </button>
      </div>
    </header>
    <main class="page">
      <small class="eyebrow">使用者與權限</small>
      <h1>帳號管理</h1>
      <p class="lead">設定誰可以登入，以及每個人能看到哪些廣告帳號。管理員不受廣告帳號限制，一律可檢視全部。</p>

      <div class="row">
        <button id="new" class="primary" type="button">＋ 新增使用者</button>
        <button id="reload" class="outline" type="button">重新整理</button>
      </div>

      <div id="listError"></div>
      <div id="list" class="list"></div>

      <section id="panel" class="panel" hidden></section>
    </main>
  </div>
  <div id="loading" class="loading" hidden><span class="spinner" aria-hidden="true"></span><span>處理中…</span></div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script src="/admin.js"></script>
</body>
</html>
