<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>後台管理｜廣告數據回報</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;color:#171717;background:#f6f7f9}
    *{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer}
    .wrap{width:min(100%,820px);margin:0 auto;background:#fff;min-height:100vh}
    header{height:62px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid #eee;position:sticky;top:0;background:#fff;z-index:5}
    header strong{font-size:17px}
    .link{border:0;background:none;color:#ff6500;font-weight:800;padding:6px}
    main{padding:24px 16px 80px}
    small.eyebrow{color:#ff6500;font-weight:800}
    h1{font-size:25px;margin:6px 0 6px}
    p.lead{color:#6b7280;line-height:1.6;margin:0 0 18px}
    .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .list{display:grid;gap:10px;margin-top:16px}
    .user{width:100%;border:1px solid #e5e7eb;border-radius:16px;background:#fff;padding:15px;text-align:left;display:grid;gap:6px}
    .user:hover{border-color:#ffc9a3}
    .user .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .user b{font-size:16px}
    .meta{color:#6b7280;font-size:13px}
    .badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;background:#f3f4f6;color:#4b5563}
    .badge.admin{background:#fff0e6;color:#c2410c}
    .badge.off{background:#fee2e2;color:#b91c1c}
    .primary,.outline,.danger{min-height:46px;border-radius:13px;font-weight:800;padding:0 18px}
    .primary{border:0;background:#ff6500;color:#fff}
    .outline{border:1px solid #e5e7eb;background:#fff;color:#374151}
    .danger{border:1px solid #fecaca;background:#fff;color:#b91c1c}
    .primary:disabled,.outline:disabled,.danger:disabled{opacity:.5;cursor:default}
    .panel{margin-top:18px;border:1px solid #e5e7eb;border-radius:18px;padding:18px}
    .panel h2{font-size:18px;margin:0 0 14px}
    label.field{display:block;font-size:13px;font-weight:800;margin-top:14px}
    input[type=text],input[type=password],select{width:100%;height:48px;margin-top:6px;border:1px solid #ddd;border-radius:12px;padding:0 12px;font:inherit;background:#fff}
    input:focus,select:focus{outline:none;border-color:#ff6500;box-shadow:0 0 0 3px #ff650016}
    .accounts{margin-top:8px;border:1px solid #eee;border-radius:12px;max-height:280px;overflow:auto}
    .acct{display:flex;gap:10px;align-items:flex-start;padding:11px 13px;border-bottom:1px solid #f3f4f6}
    .acct:last-child{border-bottom:0}
    .acct input{margin-top:3px;width:18px;height:18px;accent-color:#ff6500}
    .acct span{font-size:13px;color:#6b7280;display:block}
    .note{font-size:13px;color:#6b7280;line-height:1.6;background:#f9fafb;border-radius:12px;padding:12px;margin-top:10px}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
    .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:12px;z-index:30;max-width:90vw}
    .error-box{margin-top:16px;padding:13px;border:1px solid #f2c7b0;border-radius:13px;background:#fff7f2;color:#9a3e00;line-height:1.55}
    .loading{position:fixed;inset:0;background:#ffffffd9;z-index:20;display:grid;place-items:center;font-weight:800}
    [hidden]{display:none!important}
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <button id="home" class="link" type="button">‹ 回報系統</button>
      <strong>後台管理</strong>
      <button id="logout" class="link" type="button">登出</button>
    </header>
    <main>
      <small class="eyebrow">使用者與權限</small>
      <h1>帳號管理</h1>
      <p class="lead">設定誰可以登入，以及每個人能看到哪些廣告帳號。管理員不受廣告帳號限制，一律可檢視全部。</p>

      <div class="row">
        <button id="new" class="primary" type="button">＋ 新增使用者</button>
        <button id="reload" class="outline" type="button">重新整理</button>
      </div>

      <div id="listError"></div>
      <div id="list" class="list"></div>

      <section id="panel" class="panel" hidden></section>
    </main>
  </div>
  <div id="loading" class="loading" hidden>處理中…</div>
  <div id="toast" class="toast" hidden></div>
  <script src="/admin.js"></script>
</body>
</html>
