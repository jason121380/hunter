<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6500">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <title>Meta Token 更新｜廣告數據回報</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header>
      <div class="hdr-side">
        <a class="link" href="/">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>回報系統
        </a>
      </div>
      <strong>Meta Token</strong>
      <div class="hdr-side hdr-side--end"></div>
    </header>
    <main class="page">
      <small class="eyebrow">管理員功能</small>
      <h1>更新 Long-Lived Token</h1>
      <p class="lead">貼上剛從 Graph API Explorer 產生的短效 User Access Token，系統會用 Railway 內的 App ID / App Secret 交換成長效 Token。此頁僅限管理員使用。</p>

      <label class="field" for="short">短效 User Access Token
        <input id="short" type="password" autocomplete="off" autocapitalize="none" spellcheck="false">
      </label>
      <div class="hint">Token 會以密碼形式隱藏，避免截圖外洩。</div>

      <button id="go" class="primary" type="button">交換成 Long-Lived Token</button>
      <section id="result" class="result-box" aria-live="polite"></section>
    </main>
  </div>
  <script src="/gestures.js"></script>
  <script src="/token.js"></script>
</body>
</html>
