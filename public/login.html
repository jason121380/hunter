<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6500">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="廣告回報">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <title>登入｜廣告數據回報</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="auth" data-edge-back="off">
  <main class="auth-card">
    <div class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 512 512" width="28" height="28"><g fill="#fff"><rect x="120" y="292" width="64" height="112" rx="16"/><rect x="224" y="220" width="64" height="184" rx="16"/><rect x="328" y="132" width="64" height="272" rx="16"/></g><path d="M132 224 L236 152 L316 196 L392 108" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round" opacity=".92"/></svg>
    </div>
    <h1>廣告數據回報</h1>
    <p class="lead">請登入後進入內部廣告回報系統。</p>

    <form id="form" novalidate>
      <label class="field" for="username">帳號
        <input id="username" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </label>
      <label class="field" for="password">密碼
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </label>
      <button id="submit" class="primary" type="submit">登入</button>
      <div id="error" class="form-error" role="alert"></div>
    </form>
    <div class="auth-foot">內部系統</div>
  </main>
  <script src="/gestures.js"></script>
  <script src="/login.js"></script>
</body>
</html>
